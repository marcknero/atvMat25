<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FATEC - MATEMÁTICA PARA COMPUTAÇÃO</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body class="body">
    <!-- Novo Header com logo e link para carrinho -->
    <header class="header">
        <div class="header__logo">
            <img src="img/Logo-Fatec.jpg" alt="Logo FATEC">
        </div>
        <nav class="header__nav">
            <a href="#cart-container" class="cart-link">🛒 Ver Carrinho</a>
        </nav>
    </header>
    
    <main class="container main">
        <section class="divisor">
            <div class="divisor__line"></div>
            <img src="img/fade_bar.svg" alt="Visual bar" class="divisor__bar">
            <div class="divisor__line"></div>
        </section>
        <h1 class="page-title">Supermercado <span class="page-title__emphasis">FATEC</span></h1>
        
        <!-- Container para produtos -->
        <section class="dashboard">
            <div id="products-container" class="dashboard__items">
                <!-- Produtos serão inseridos aqui via JS -->
            </div>
        </section>
        
        <!-- Wrapper para carrinho e sugestões lado a lado -->
        <div class="cart-suggestions-wrapper">
            <!-- Container para o carrinho -->
            <section class="dashboard__cart" id="cart-container">
                <h2>Seu Carrinho</h2>
                <ul id="cart"></ul>
                <p id="cart__total">Total: R$ 0.00</p>
            </section>
            
            <!-- Container para sugestões -->
            <section class="dashboard__return" id="sugestoes-container">
                <!-- Sugestões serão inseridas aqui via JS -->
            </section>
        </div>
        
        <!-- Alert para notificações -->
        <div id="alert" class="alert hidden"></div>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
